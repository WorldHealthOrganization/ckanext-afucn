name: Deploy to Azure VM

on:
  push:
    branches:
      - develop

jobs:
  deploy-to-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: |
          az account set --subscription 8c247e8d-4f67-46e2-b10e-e89fc1a60fbd

      - name: Create deployment script
        run: |
          cat <<'EOF' > deploy.sh
          #!/bin/bash
          set -e

          cd /dataportal/dataportal
          cp -f .env.prod .env

          echo ">>> Starting docker compose build"
          docker compose build --no-cache > /tmp/docker_build.log 2>&1
          echo ">>> Docker build finished"

          echo ">>> Starting docker compose up"
          docker compose up -d >> /tmp/docker_build.log 2>&1
          echo ">>> Docker containers started"

          echo "DEPLOYMENT_DONE"
          EOF

      - name: Run deployment on VM and wait
        run: |
          # Run the script and capture output
          output=$(az vm run-command invoke \
            --command-id RunShellScript \
            --name vm-pph-dataportal \
            --resource-group PPH-P-EUW-RG01 \
            --scripts @deploy.sh \
            --query "value[0].message" -o tsv)

          echo "$output"

          # Check for explicit done signal
          if echo "$output" | grep -q "DEPLOYMENT_DONE"; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment did not finish correctly"
            exit 1
          fi
